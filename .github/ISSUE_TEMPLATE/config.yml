# Sin issues en blanco a propósito.
#
# Este repositorio es público: cualquiera lee lo que se escribe aquí, y para
# siempre. Las plantillas existen sobre todo para avisar de eso antes de que
# alguien pegue una foto de su carné o el número de su teléfono, y un issue en
# blanco se salta ese aviso.
blank_issues_enabled: false

contact_links:
  - name: Problema con mi cuenta
    url: https://github.com/AEWhite-Devs/Issues/blob/main/README.md#mi-cuenta
    about: Si el problema es con tu cuenta, tus datos o un viaje concreto, escríbenos en privado. Aquí no, que lo lee todo el mundo.
  - name: Reportar un problema de seguridad
    url: https://github.com/AEWhite-Devs/Issues/blob/main/README.md#seguridad
    about: Los fallos de seguridad no se publican. Cuéntanoslo en privado y te respondemos.
